[tool.poetry]
name = "watchmen-perf-lambda-pipeline"
version = "18.0.0"
description = "Performance testing for AWS Lambda ingestion paths to Watchmen pipeline"
authors = ["Watchmen"]
license = "MIT"
readme = "README.md"
packages = [{ include = "watchmen_perf_lambda_pipeline", from = "src" }]

[tool.poetry.dependencies]
python = "~3.12"
locust = "^2.27.0"
boto3 = "^1.34.140"
httpx = "^0.27.0"
jinja2 = "^3.1.4"
pydantic = "^2.7.0"
typer = "^0.12.3"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
ruff = "^0.5.0"

[tool.poetry.scripts]
perf-report = "watchmen_perf_lambda_pipeline.report.generator:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
